{% extends base.html %}

{% block title %}
    Delete Product - ToriloShop
{% endblock %}


{% block content %}

    <h2>
        Delete {{product.name}}?
    </h2>

    <p>
        This action cannot be undone. Are you sure you want to delete this product?
    </p>

    <form method="POST">
        {% csrf_token %}

        <button type="submit">
            Confirm Delete
        </button>

        <a href="{% url 'product_list' %}">
            Cancel
        </a>
    </form>

    

{% endblock %}
