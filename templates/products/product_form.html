(% extends "base.html" %)

{% block title %}
    Product Form - ToriloShop
{% endblock %}

{% block content %}

    <h1>
        {% if form.instance.pk %}
            Edit 
        {% else %}
            Add NEW
        {% endif %}
    </h1>

    <form method="POST" action="" enctype="multipart/form-data">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Product
        </button>
    </form>

    < href="{% url 'product_list' %}">
        Cancel
    </a>
    
{% endblock %}
