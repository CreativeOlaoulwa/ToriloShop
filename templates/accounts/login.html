{% extends 'base.html' %}

{% block title %}Login - ToriloShop{% endblock %}

{% block content %}
    <h2>Login to your account</h2>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Login</button>
    </form>

    <p>Don't have an account? 
    <a href="{% url 'register' %}">Register here</a>.</p>
{% endblock %}
